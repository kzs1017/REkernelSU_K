# 内核源码地址（使用社区维护版本）
KERNEL_SOURCE=https://github.com/DtHnAme/kernel_blackshark_penrose
# 分支（根据实际情况调整）
KERNEL_SOURCE_BRANCH=lineage-19.1
# 内核配置文件（根据源码实际路径调整）
KERNEL_CONFIG=lineageos_penrose_defconfig

# CPU架构
ARCH=arm64
# 内核镜像名称
KERNEL_IMAGE_NAME=Image.gz-dtb

# 编译工具链（保持默认）
ENABLE_CLANG=true
USE_AOSP_CLANG=true
AOSP_CLANG_VERSION=r450784e

# KernelSU 相关
ENABLE_KERNELSU=true
KERNEL_INSTALLER=https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh
KERNELSU_TAG=

# 编译优化选项
DISABLE_LTO=true
DISABLE_CC_WERROR=true
ADD_KPROBES_CONFIG=true
ADD_OVERLAYFS_CONFIG=true
ENABLE_CCACHE=true
