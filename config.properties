# ==================== 必须修改的核心参数 ====================
# 内核源码地址（必须修改！）
KERNEL_SOURCE=https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git
# 内核源码分支（必须修改！）
KERNEL_SOURCE_BRANCH=shark-q-oss
# 内核配置文件名称（必须修改！）
KERNEL_CONFIG=vendor/penrose_defconfig
# CPU架构
ARCH=arm64
# 内核镜像名称
KERNEL_IMAGE_NAME=Image.gz-dtb

# ==================== 编译工具链（保持默认即可） ====================
# 启用Clang编译
ENABLE_CLANG=true
# 使用AOSP Clang
USE_AOSP_CLANG=true
# Clang版本（5.4内核用这个版本比较稳）[reference:6]
AOSP_CLANG_VERSION=r450784e

# ==================== KernelSU 相关 ====================
# 启用 KernelSU
ENABLE_KERNELSU=true
# KernelSU 安装脚本（官方版）[reference:7]
KERNEL_INSTALLER=https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh
# KernelSU 版本（留空=最新稳定版）[reference:8]
KERNELSU_TAG=

# ==================== 编译优化选项 ====================
# 禁用LTO（避免编译出错）[reference:9]
DISABLE_LTO=true
# 禁用CC_WERROR（避免警告导致编译失败）[reference:10]
DISABLE_CC_WERROR=true
# 自动添加Kprobes支持[reference:11]
ADD_KPROBES_CONFIG=true
# 自动添加overlayfs支持[reference:12]
ADD_OVERLAYFS_CONFIG=true
# 启用ccache加速二次编译[reference:13]
ENABLE_CCACHE=true
